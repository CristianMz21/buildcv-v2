# SonarQube Cloud analysis for BuildCv.
#
# The values below are the ones SonarCloud's own "add a .NET project" tutorial hands you; correct them
# only if your organization/project key differs. There is one place to edit, and the CI job reads it
# from here — the job only RUNS once SONAR_TOKEN exists as a repository secret (see ci.yml).
sonar.organization=cristianmz21
sonar.projectKey=cristianmz21_buildcv-v2

# Sources are only the product code. Tests are analyzed for their own issues but must not count toward
# the project's coverage gate; excluding them from sources entirely would hide test-quality findings.
sonar.sources=src
sonar.tests=tests

# Migrations are scaffolded output: reading their generated SQL does nothing for this product's
# quality, and their boilerplate would bury the findings that matter.
sonar.exclusions=**/Migrations/**

# The in-memory repositories are NOT excluded on purpose: the whole Api suite runs on them, so their
# line coverage is a real measurement, not an artifact of a branch production never takes.
