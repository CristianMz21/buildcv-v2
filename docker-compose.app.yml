# The whole product: SQL Server, the API, and the web client.
#
#   cp .env.example .env      # fill in every required value
#   docker compose -f docker-compose.app.yml up --build
#
# docker-compose.yml beside this one is a DIFFERENT thing and stays that way: it runs SQL Server
# alone, for `dotnet run` on the host and for `dotnet ef database update`. Merging them would mean a
# migration command silently started an API container.
#
# The web client lives in a SEPARATE REPOSITORY and is expected as a sibling checkout, which is what
# its README says. Change the build context if yours is elsewhere.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # DEVELOPER EDITION IS NOT LICENSED FOR PRODUCTION. It is free and full-featured, which is why it
      # is the default here, and Microsoft's terms restrict it to development and test use — so this
      # service as written cannot legally serve a live product.
      #
      # Overriding the variable is NOT the fix on its own. The recommended production answer is to not
      # run this service at all: point ConnectionStrings__BuildCv at a managed instance, which also
      # brings the backups, patching and point-in-time restore that a docker volume does not have. See
      # docs/deployment.md.
      MSSQL_PID: ${MSSQL_PID:-Developer}
      # BOTH limits, and the ordering between them is the point. SQL Server on Linux takes all the
      # memory it can see by default, so an uncapped container starves the API beside it. But capping
      # only the CONTAINER makes the kernel OOM-kill sqlservr mid-transaction, because SQL Server never
      # learns it should back off -- a hard kill instead of a slow query.
      #
      # MSSQL_MEMORY_LIMIT_MB is what it reads, and it is deliberately BELOW mem_limit so SQL Server
      # hits its own ceiling first and manages itself down, while the container limit stays a backstop
      # that should never fire.
      #
      # DO NOT VERIFY THIS WITH `max server memory (MB)`. That setting is untouched by this variable and
      # still reads 2147483647, which looks exactly like the limit being ignored -- it is a different
      # knob, sizing the buffer pool rather than the process. The query that actually answers is
      #
      #   SELECT committed_target_kb / 1024 FROM sys.dm_os_sys_info;
      #
      # Measured on this stack: 1417 MB against the 2048 set here. Anyone who checks the wrong one
      # concludes the setting does nothing and deletes it.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    # No published port. The API reaches it over the compose network; publishing it would put a
    # database on the host for the convenience of nobody in this file.
    # Sized for a development host. Raise both together for anything real -- and keep
    # MSSQL_MEMORY_LIMIT_MB under mem_limit, or the backstop becomes the primary.
    mem_limit: ${MSSQL_MEM_LIMIT:-3g}
    volumes:
      # A NAMED VOLUME IS NOT A BACKUP. `docker compose down -v` erases it, and so does a lost host.
      # Nothing in this file backs it up; see docs/deployment.md before putting real CVs in here.
      - buildcv-app-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs once, applies the schema, exits. The API waits for it to succeed.
  #
  # Without this the stack comes up and does nothing: SQL Server starts empty, and the API's own
  # auto-migration is gated on IsDevelopment() while the container runs Production -- deliberately, so
  # that the process serving traffic never owns the schema. Every write then failed with error 4060,
  # "Cannot open database 'BuildCv' requested by the login", and the accompanying "Login failed for
  # user 'sa'" sends you after credentials that were never wrong. The whole test suite is silent on
  # this: it never brings the composed product up.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    # NOT `unless-stopped`: this container is meant to exit 0, and a restart policy would relaunch it
    # forever on success.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Every one of these is REQUIRED with no default. The app validates the JWT key and the whole
      # encryption ring at startup and refuses to run without them, which is the behaviour to keep —
      # a default here would be a committed key that some deployment inherits.
      ConnectionStrings__BuildCv: Server=sqlserver,1433;Database=BuildCv;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Jwt__SigningKey: ${BUILDCV_JWT_SIGNING_KEY:?set BUILDCV_JWT_SIGNING_KEY in .env, 32+ chars}
      # THE KEY IDS ARE LITERALS, and they have to be: Compose does not substitute variables in a
      # mapping KEY, only in a value. Written as `Encryption__Keys__${ID}__Aes` the name reached the
      # container with the braces intact, the ring came up empty, and the API refused to start —
      # measured with `docker compose config`, which prints the unsubstituted name.
      #
      # Rotating therefore means EDITING THIS FILE: add a second `Encryption__Keys__v2__Aes` line and
      # move ActiveKeyId to v2. Do not repoint v1 at new material — every row already written under
      # it still has to decrypt, which is why reads use every configured key and writes use only the
      # active one.
      Encryption__ActiveKeyId: v1
      Encryption__Keys__v1__Aes: ${BUILDCV_ENCRYPTION_KEY:?set BUILDCV_ENCRYPTION_KEY in .env, base64 32 bytes}
      Encryption__BlindIndex__ActiveKeyId: b1
      Encryption__BlindIndex__Keys__b1: ${BUILDCV_BLIND_INDEX_KEY:?set BUILDCV_BLIND_INDEX_KEY in .env, base64 32 bytes}
      # NOT SET, deliberately: Cors:AllowedOrigins stays empty because nothing talks to this API from
      # a browser. The web container calls it server-side with a bearer token, so there is no
      # cross-origin request to allow — and an origin listed here would be one that could be tried.
    depends_on:
      sqlserver:
        condition: service_healthy
      # service_completed_successfully, not service_started: the API must not accept traffic against a
      # half-applied schema. migrate.sh runs sqlcmd with -b so a failed batch is a non-zero exit, which
      # is what makes this condition mean anything.
      migrator:
        condition: service_completed_successfully
    # No published port either. The API is reachable only from the web container, which is the whole
    # security argument for the BFF: no browser ever holds a BuildCv credential, and nothing outside
    # this network can reach /v1 at all.
    expose:
      - "8080"
    restart: unless-stopped
    # A ceiling, not a tuning knob. POST /resumes/import accepts 2 MiB of candidate text and the DOCX
    # reader was measured turning 150 KB into 662 MiB of DOM before it was made to stream -- so an
    # unbounded container is one unlucky upload away from taking the database down with it. Limits mean
    # the API dies alone and `restart: unless-stopped` brings it back.
    mem_limit: 1g
    cpus: 2.0

  web:
    build:
      context: ../buildcv-web
      dockerfile: Dockerfile
    environment:
      # Service name, not localhost: inside the network the API is a peer container.
      BUILDCV_API_ORIGIN: http://api:8080
    depends_on:
      - api
    ports:
      # The only thing on the host. Everything a user touches goes through here.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    # The last container without a ceiling. Next.js renders server-side, so a request holds its work in
    # this process's heap -- and this is the ONLY service reachable from outside, which makes it the one
    # an attacker can lean on. Without a limit it competes with the database for the same host memory.
    mem_limit: ${WEB_MEM_LIMIT:-512m}

volumes:
  buildcv-app-sqlserver-data:
