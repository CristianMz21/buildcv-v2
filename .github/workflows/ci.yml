name: CI

on:
  push:
    branches: [main]
  # Every base branch, not just main: stacked PRs target their parent branch, and a
  # `branches: [main]` filter silently skips CI for all of them until they retarget.
  pull_request:
    branches: ['**']

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BuildCv.slnx

      - name: Build
        run: dotnet build BuildCv.slnx -c Release --no-restore

      - name: Format check
        run: dotnet format BuildCv.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test BuildCv.slnx -c Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage"

      # A VULNERABILITY DISCLOSED TOMORROW NEEDS NOBODY TO REMEMBER. Until this step existed the audit
      # only ran when a human typed it, which means the answer was accurate on the day somebody asked
      # and unknown every day after -- and the interesting case is always a package that was clean when
      # it was added.
      #
      # --include-transitive is the point. Nothing here references Azure.Identity or
      # Microsoft.Identity.Client directly; they arrive four levels down from
      # EntityFrameworkCore.SqlServer, which is exactly where a direct-only audit would miss them.
      #
      # `dotnet list package` reports findings and still EXITS 0, so the grep is what fails the build.
      # A step that cannot fail is a step that says nothing.
      - name: Vulnerable package audit
        run: |
          dotnet list BuildCv.slnx package --vulnerable --include-transitive 2>&1 | tee /tmp/audit.txt
          if grep -qiE '^\s*>' /tmp/audit.txt; then
            echo "::error::Vulnerable packages found -- see the listing above."
            exit 1
          fi
          echo "No vulnerable packages."

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BuildCv.slnx

      - name: Build
        run: dotnet build BuildCv.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BuildCv.slnx -c Release --no-build --filter "Category=Integration" --collect:"XPlat Code Coverage"

  # THE JOB THAT WOULD HAVE CAUGHT MOST OF THIS MONTH. Every deployment defect found in this repository
  # was found by hand, by somebody bringing the stack up and looking -- the image not building at all,
  # the schema never being created, the stack not surviving a restart. The unit suite was green through
  # all of them, and stays green through the next one, because nothing in it composes anything.
  #
  # It brings up sqlserver + migrator + api. It cannot build `web`: that lives in a separate repository
  # and checking it out here would need credentials for a checkout CI has no other reason to hold.
  #
  # HONESTLY, WHAT IT DOES NOT COVER: the umask trap. A runner builds at umask 022, so the published
  # files land 644 and the container reads them -- the failure only appears for whoever builds with a
  # restrictive umask, which is exactly why the Dockerfile states --chmod instead of relying on this.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Throwaway values, generated per run. Nothing here is a secret worth having: the stack is
      # destroyed in the same job, and the app refuses to start without them, which is the behaviour
      # being exercised.
      - name: Write a disposable .env
        run: |
          {
            echo "MSSQL_SA_PASSWORD=Ci_Throwaway_Password_1"
            echo "BUILDCV_JWT_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "BUILDCV_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "BUILDCV_BLIND_INDEX_KEY=$(openssl rand -base64 32)"
          } > .env

      # The cheapest check that .env is complete, and the one that fails before anything is built.
      - name: Compose config resolves
        run: docker compose -f docker-compose.app.yml config > /dev/null

      - name: Build and start
        run: docker compose -f docker-compose.app.yml up --build -d sqlserver migrator api

      # `up` returns as soon as the containers start, not when the API can serve. Readiness is the
      # signal that the migrator ran AND the database is reachable, which is the pair that was broken.
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            code=$(docker compose -f docker-compose.app.yml exec -T api \
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              http://localhost:8080/health/ready 2>/dev/null || echo 000)
            [ "$code" = "200" ] && echo "ready after ${i} attempts" && exit 0
            sleep 5
          done
          echo "::error::/health/ready never answered 200"
          docker compose -f docker-compose.app.yml logs --tail 60
          exit 1

      # A WRITE, not a probe. The schema being present is the thing that was missing, and only a write
      # touches it -- readiness opens a connection and queries nothing.
      - name: Register an account through the API
        run: |
          code=$(docker compose -f docker-compose.app.yml exec -T api \
            curl -s -o /tmp/r.json -w '%{http_code}' --max-time 30 \
            -X POST http://localhost:8080/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci-smoke@example.com","password":"Ci_Throwaway_Password_1"}')
          if [ "$code" != "201" ]; then
            echo "::error::register answered $code, expected 201"
            docker compose -f docker-compose.app.yml logs api --tail 60
            exit 1
          fi

      # RESTART SURVIVAL, without -v so the data stays. This is its own failure: SQL Server accepts
      # connections against master while a user database is still recovering, so the migrator failed
      # here on every restart and the API never started behind it.
      - name: Survive a restart
        run: |
          docker compose -f docker-compose.app.yml down
          docker compose -f docker-compose.app.yml up -d sqlserver migrator api
          for i in $(seq 1 40); do
            code=$(docker compose -f docker-compose.app.yml exec -T api \
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              http://localhost:8080/health/ready 2>/dev/null || echo 000)
            [ "$code" = "200" ] && echo "ready again after ${i} attempts" && exit 0
            sleep 5
          done
          echo "::error::the stack did not come back after a restart"
          docker compose -f docker-compose.app.yml logs --tail 80
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.app.yml down -v

  # SONARQUBE CLOUD — the deterministic half of review, CodeRabbit's complement. CodeRabbit reads a PR
  # the way a senior engineer does; this reads the same diff the way six thousand deterministic rules
  # do, and answers with a quality gate rather than a comment.
  #
  # WHY THE ANALYSIS JOB IS CONDITIONAL: it needs SONAR_TOKEN, a repository secret only somebody with
  # admin rights can create. Until it exists this job would fail every PR for a reason that has nothing
  # to do with the code, so it stays invisible until the secret is added. The secret is created in
  # Settings → Secrets and variables → Actions.
  #
  # The gate has to go through a probe job because of what a job-level `if` can reference: the GitHub
  # Actions context-availability table allows only `github`, `needs`, `vars` and `inputs` there --
  # neither `secrets` (rejected at parse time) nor `env` (same) is visible to a job's own `if`. So a
  # two-second job that can read the secret into its env, and reports its presence as an output, is
  # the narrowest thing that lets the real job learn it via `needs`.
  sonar-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  sonar-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sonar-probe
    if: ${{ needs.sonar-probe.outputs.enabled == 'true' }}
    # checks: write is what lets the quality-gate step report a check run on the PR. Everything else
    # the job does is read-only, and that is all it is granted.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud attributes findings to the commit that introduced them; a shallow clone would
          # rob it of the history to do that with.
          fetch-depth: 0

      # The SonarScanner for .NET is a Java process in disguise.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Scanner packages are large and version-stable; a cache is a minute saved per run.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # begin/build/end must run in ONE job: the scanner records MSBuild's compilation events, so the
      # build it sees must be the build being analyzed. This job deliberately re-runs the build that
      # build-and-unit-test already did, rather than sharing artifacts, because a build nobody scanned
      # is not the analysis this product shipped.
      #
      # The org and project key live HERE, on the command line, because that is the only configuration
      # the SonarScanner for .NET reads: it ignores sonar-project.properties (it looks for a settings
      # file next to the executable, which is not this repo), so a properties file would be a second,
      # inert statement of the same values. sonar.sources and sonar.tests narrow the analysis the same
      # way the properties file would have; the in-memory repositories stay covered because the whole
      # Api suite runs on them.
      - name: Begin analysis
        run: |
          dotnet sonarscanner begin \
            /k:cristianmz21_buildcv-v2 \
            /o:cristianmz21 \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.sources="src" \
            /d:sonar.tests="tests" \
            /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/coverage.cobertura.xml"

      - name: Build
        run: dotnet build BuildCv.slnx -c Release

      # Identical to the step in build-and-unit-test — XPlat coverage already writes cobertura, which
      # is what the begin step above told the scanner to expect.
      - name: Test
        run: dotnet test BuildCv.slnx -c Release --no-build --filter "Category!=Integration" --collect:"XPlat Code Coverage"

      - name: End analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # PUBLISHES THE IMAGES, and the point is that no long-lived credential exists anywhere. GITHUB_TOKEN
  # is minted for this run and expires with it, so nothing on a laptop and nothing in Azure holds push
  # rights. It replaced a personal token that carried `repo` and `delete_repo` -- a credential able to
  # delete the repository, held only to push a container image.
  #
  # ON MAIN ONLY, and only after the three checks above pass: a pull request must not be able to publish
  # an image that a deployment could then pull.
  #
  # The packages are PUBLIC, which is what lets the container apps pull with no registry credential at
  # all. That is safe because the image carries nothing the public repository does not -- audited: no
  # .env, no keys, no .git, and the only baked variables are the port and the UID. Visibility is a
  # property of the PACKAGE and survives every later push, so it is set once by hand and never again --
  # verified by pushing a second tag and watching it stay public. A package that is DELETED and
  # recreated starts private again, which is the one case that needs the click repeated.
  publish-images:
    runs-on: ubuntu-latest
    needs: [build-and-unit-test, integration-test, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # TAGGED BY COMMIT, and `latest` alongside it. The commit tag is what a deployment should
      # reference: "latest in a registry" cannot tell you which build is running, and this repository
      # has already been bitten by an image that was newer than the commit it was assumed to carry.
      # THE OWNER IS LOWERCASED BY HAND, not taken from github.repository_owner, because that context
      # returns the account's real casing (CristianMz21) and a container reference must be lowercase --
      # the push fails with "invalid reference format" rather than with anything mentioning case.
      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/cristianmz21/buildcv-api:${{ github.sha }}
            ghcr.io/cristianmz21/buildcv-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/cristianmz21/buildcv-migrator:${{ github.sha }}
            ghcr.io/cristianmz21/buildcv-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
